name: Photon engine
on:
  pull_request:
    paths: ['packages/photon/**', '.github/workflows/photon-quality.yml', '.github/workflows/release.yml', '.bun-version']
  push:
    branches: [main]
    paths: ['packages/photon/**', '.github/workflows/photon-quality.yml', '.github/workflows/release.yml', '.bun-version']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photon-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify source, tarball, contracts, exports and package inventory
        working-directory: packages/photon
        env:
          PHOTON_RELEASE_ARTIFACTS: ${{ runner.temp }}/photon-release
        run: bun run verify:release
      - name: Record source identity
        if: always()
        env:
          EVIDENCE: ${{ runner.temp }}/photon-release
        run: |
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD > "$EVIDENCE/source-sha.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: photon-engine-${{ github.sha }}
          path: ${{ runner.temp }}/photon-release
          if-no-files-found: error
