name: Publish Photon
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Registry dist-tag (beta for prereleases, latest for stable)
        required: true
        type: choice
        options: [beta, latest]
permissions:
  contents: read
concurrency:
  group: photon-npm-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'gravito-framework/photon' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Check version and publication channel
        working-directory: packages/photon
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: bun scripts/check-release.ts
      - name: Verify and pack the engine
        working-directory: packages/photon
        env:
          PHOTON_RELEASE_ARTIFACTS: ${{ runner.temp }}/photon-release
        run: bun run verify:release
      - name: Publish the verified tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          EVIDENCE: ${{ runner.temp }}/photon-release
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=("$EVIDENCE"/*.tgz)
          test "${#archives[@]}" -eq 1
          npm publish "${archives[0]}" --access public --provenance --tag "$RELEASE_CHANNEL"
      - name: Record source identity
        if: always()
        env:
          EVIDENCE: ${{ runner.temp }}/photon-release
        run: |
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD > "$EVIDENCE/source-sha.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: photon-publication-${{ github.sha }}
          path: ${{ runner.temp }}/photon-release
          if-no-files-found: error
