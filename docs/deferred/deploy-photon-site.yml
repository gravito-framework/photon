name: Photon Site

on:
  push:
    branches: [main]
    paths:
      - 'examples/photon-site/**'
      - '.github/workflows/deploy-photon-site.yml'
      - '.bun-version'
  pull_request:
    paths:
      - 'examples/photon-site/**'
      - '.github/workflows/deploy-photon-site.yml'
      - '.bun-version'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the verified site to Cloudflare Pages (authorized cutover only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/photon-site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install site dependencies
        run: |
          if [ ! -f bun.lock ]; then
            echo 'Site lockfile is blocked until Photon beta and compatible Gravito packages are published. See README.md.' >&2
            exit 1
          fi
          bun install --frozen-lockfile
      - name: Typecheck site
        run: bun run typecheck
      - name: Build and verify routes, assets and links
        run: bun run build:check
        env:
          NODE_ENV: production
          BASE_URL: https://photon.gravito.dev
          GA_PHOTON_SITE: ${{ secrets.GA_PHOTON_SITE }}
      - name: Save verified site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: photon-site-${{ github.sha }}
          path: examples/photon-site/dist/static
          if-no-files-found: error

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Download verified site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name "photon-site-$GITHUB_SHA" --dir site
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4.158.0 pages deploy site --project-name=photon-site --branch=main
